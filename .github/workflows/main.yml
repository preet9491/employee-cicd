name: employee-form

on:
  push:
    branches:
      - main

jobs:
  CI:
    name: Deploy and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Docker Image
        run: docker build -t webinar .

      - name: Run Container
        run: docker run -d --name container webinar
```
